<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- Tells phones to render at their real width. Without this, mobile browsers
     pretend to be a ~980px desktop and shrink everything down to unreadable. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Asks search engines not to list this page. The page is public (free GitHub
     Pages requires a public repo), so this does not make it secret — it just
     keeps it out of Google so nobody stumbles onto it. -->
<meta name="robots" content="noindex, nofollow">
<title>Eli's Dashboard</title>
<style>
  body {
    font-family: -apple-system, "Segoe UI", sans-serif;
    margin: 0; padding: 2rem; min-height: 100vh; color: #1a2b3c;
    /* a soft sky gradient background so the page feels weather-y */
    background: linear-gradient(160deg, #7cb2e8, #a9d0f5 40%, #dfeefc);
  }
  /* the page header: the title on the left, the universal Refresh button on the right */
  .page-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }
  .page-head h1 { margin: 0; }

  /* the dashboard is a grid of widgets. auto-fill + minmax lets as many widgets
     as fit sit side by side, so the page doesn't become one tall scrolling column.
     align-items: start keeps each widget its own natural (short) height. */
  .grid {
    display: grid; gap: 1.5rem; align-items: start;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  }

  /* every widget sits on a frosted white card, sized to its content */
  .panel {
    background: rgba(255, 255, 255, 0.75);
    border-radius: 18px; padding: 1rem 1.25rem;
    box-shadow: 0 8px 24px rgba(30, 60, 110, 0.15);
  }
  /* the Refresh button */
  #refresh-btn {
    border: none; background: #2b7de0; color: #fff; cursor: pointer;
    padding: 0.5rem 1rem; border-radius: 999px; font-size: 0.9rem;
  }
  #refresh-btn:hover { background: #1e63bd; }
  #refresh-btn:disabled { opacity: 0.6; cursor: default; }

  .updated { margin: 0.2rem 0 0.75rem; color: #4a6076; font-size: 0.8rem; }

  /* Make the "hidden" attribute always win. Without this, a rule like ".scores-strip
     { display: flex }" would quietly override it and a hidden score card would still show. */
  [hidden] { display: none !important; }

  /* the "right now" card — kept compact so the widget stays short */
  .hero {
    display: flex; align-items: center; gap: 0.9rem; margin-bottom: 0.9rem;
    background: rgba(255, 255, 255, 0.6); border-radius: 14px; padding: 0.75rem 1rem;
  }
  .hero-emoji { font-size: 2.6rem; line-height: 1; }
  .hero-temp { font-size: 2.3rem; font-weight: 700; line-height: 1; }
  .hero-cond { font-size: 1rem; color: #33495e; }
  .hero-rain { font-size: 0.85rem; color: #4a6076; }

  /* the coming hours: ONE horizontal strip you scroll sideways for more. This is
     what keeps the widget short instead of stacking 24 rows down the page. */
  .hours { display: flex; flex-wrap: nowrap; gap: 0.5rem; overflow-x: auto; padding-bottom: 0.4rem; }
  .day-label {
    display: flex; align-items: center; flex: 0 0 auto; font-size: 0.75rem;
    font-weight: 600; color: #33495e;
    border-left: 2px solid rgba(43, 125, 224, 0.3); padding-left: 0.5rem; margin-left: 0.15rem;
  }
  .hour {
    flex: 0 0 auto; min-width: 58px; text-align: center;
    background: rgba(255, 255, 255, 0.7); border-radius: 12px; padding: 0.5rem 0.6rem;
  }
  .hour-time { font-size: 0.72rem; color: #4a6076; }
  .hour-emoji { font-size: 1.3rem; }
  .hour-temp { font-weight: 700; }
  .hour-rain { font-size: 0.72rem; color: #2b7de0; }

  /* stocks: one small card per ticker, each with a sparkline chart. The list has a
     capped height and scrolls inside itself so the widget stays compact. */
  .stocks-list { display: flex; flex-direction: column; gap: 0.5rem; max-height: 240px; overflow-y: auto; }
  .stock {
    display: flex; align-items: center; gap: 0.6rem;
    background: rgba(255, 255, 255, 0.7); border-radius: 12px; padding: 0.5rem 0.7rem;
  }
  /* wide enough for a name like "S&P 500" (it was 48px when it held "AAPL") */
  .stock-sym { font-weight: 700; width: 72px; flex: 0 0 auto; }
  .spark { width: 110px; height: 34px; flex: 0 0 auto; }
  .stock-nums { margin-left: auto; text-align: right; }
  .stock-price { font-weight: 700; }
  .stock-change { font-size: 0.78rem; }

  /* youtube: a vertical list of video cards (thumbnail + title). Like the other
     widgets it has a capped height and scrolls inside itself to stay compact. */
  .yt-list { display: flex; flex-direction: column; gap: 0.6rem; max-height: 360px; overflow-y: auto; }
  .yt-card {
    display: flex; gap: 0.6rem;
    background: rgba(255, 255, 255, 0.7); border-radius: 12px; padding: 0.5rem;
  }
  .yt-thumb-link { flex: 0 0 auto; }
  .yt-thumb { width: 120px; height: 68px; object-fit: cover; border-radius: 8px; display: block; }
  /* min-width: 0 lets the long title shrink and clamp instead of overflowing the card */
  .yt-meta { display: flex; flex-direction: column; gap: 0.25rem; min-width: 0; flex: 1 1 auto; }
  .yt-title {
    font-size: 0.85rem; font-weight: 600; color: #1a2b3c; text-decoration: none;
    /* clamp the title to two lines with an ellipsis so tall titles don't stretch the card */
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .yt-title:hover { text-decoration: underline; }
  .yt-channel { font-size: 0.72rem; color: #4a6076; }
  /* margin-top: auto pushes the buttons to the bottom of the card, lined up neatly */
  .yt-actions { margin-top: auto; display: flex; gap: 0.4rem; align-items: center; }
  .yt-remove {
    border: none; background: rgba(0, 0, 0, 0.08); color: #33495e; cursor: pointer;
    font-size: 0.72rem; line-height: 1; padding: 0.25rem 0.45rem; border-radius: 999px;
  }
  .yt-remove:hover { background: #d64545; color: #fff; }
  .yt-empty { color: #4a6076; font-size: 0.85rem; padding: 0.4rem 0; }

  /* news: a vertical list of headlines grouped under each subject. Like the other
     widgets it has a capped height and scrolls inside itself to stay compact. */
  .news-list { display: flex; flex-direction: column; gap: 0.9rem; max-height: 420px; overflow-y: auto; }
  /* each subject (e.g. "Seahawks") is a group: its heading plus today's stories */
  .news-subject { display: flex; flex-direction: column; gap: 0.5rem; }
  /* a subject heading — a small labelled divider before its stories */
  /* display:flex lines the heading up with its ✕ and lets margin-left:auto on the button
     push it to the far right of the row. */
  .news-subject-title {
    font-size: 0.78rem; font-weight: 700; color: #33495e;
    border-left: 2px solid rgba(43, 125, 224, 0.3); padding-left: 0.5rem;
    display: flex; align-items: center; gap: 0.4rem;
  }
  /* the ✕ next to a subject heading: clears every headline showing under that subject at
     once. Styled like the per-story ✕ below, a touch smaller, so the two read as the same
     action at two different sizes. */
  .news-clear {
    margin-left: auto; border: none; background: rgba(0, 0, 0, 0.08); color: #33495e;
    cursor: pointer; font-size: 0.68rem; line-height: 1; padding: 0.15rem 0.4rem;
    border-radius: 999px;
  }
  .news-clear:hover { background: #d64545; color: #fff; }
  .news-story {
    background: rgba(255, 255, 255, 0.7); border-radius: 12px; padding: 0.5rem 0.7rem;
    display: flex; flex-direction: column; gap: 0.25rem;
  }
  .news-headline {
    font-size: 0.85rem; font-weight: 600; color: #1a2b3c; text-decoration: none;
    /* clamp long headlines to two lines so a tall one doesn't stretch the row */
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .news-headline:hover { text-decoration: underline; }
  /* the little line under a headline: the source badge, the outlets, and the time */
  .news-sub { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem; font-size: 0.72rem; color: #4a6076; }
  .news-badge { border-radius: 999px; padding: 0.05rem 0.45rem; font-weight: 700; font-size: 0.68rem; }
  .news-badge.multi { background: #d8f0dd; color: #1c7a35; }   /* 2+ outlets ran it */
  .news-badge.single { background: rgba(0, 0, 0, 0.06); color: #4a6076; }  /* just one */
  .news-src { min-width: 0; }
  .news-time { white-space: nowrap; }
  /* the ✕ delete for a story — pushed to the far right of the sub-line, styled like the
     YouTube remove button so the two panels feel consistent. */
  .news-remove {
    margin-left: auto; border: none; background: rgba(0, 0, 0, 0.08); color: #33495e;
    cursor: pointer; font-size: 0.72rem; line-height: 1; padding: 0.2rem 0.4rem; border-radius: 999px;
  }
  .news-remove:hover { background: #d64545; color: #fff; }
  .news-empty { color: #4a6076; font-size: 0.85rem; padding: 0.1rem 0 0.2rem; }

  /* The freshness strip under the page title: when each source was last fetched, a live
     countdown to the next real re-fetch, and a link to start a rebuild by hand.
     "flex-wrap: wrap" lets it fold onto extra lines on a phone instead of overflowing. */
  .fresh-strip {
    display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem 0.9rem;
    margin: 0 0 0.9rem; padding: 0.45rem 0.7rem; border-radius: 8px;
    background: rgba(255, 255, 255, 0.75); border: 1px solid #d7e2ec;
    font-size: 0.78rem; color: #4a6076;
  }
  .fresh-items { display: flex; flex-wrap: wrap; gap: 0.4rem 0.8rem; }
  .fresh-item b { color: #23384b; font-weight: 600; }
  /* The countdown line. .is-ready turns it green once a forced rebuild would really
     fetch new data — the one moment the manual button is worth pressing. */
  .fresh-next { margin-left: auto; }
  .fresh-next.is-ready { color: #1c7c4a; font-weight: 600; }
  .fresh-run {
    color: #23384b; text-decoration: none; border: 1px solid #c3d3e0;
    border-radius: 999px; padding: 0.15rem 0.55rem; background: #fff; white-space: nowrap;
  }
  .fresh-run:hover { background: #23384b; color: #fff; border-color: #23384b; }
  /* On a narrow phone the countdown should start its own line rather than being
     squeezed against the link. */
  @media (max-width: 560px) {
    .fresh-next { margin-left: 0; }
  }

  /* The score keeper above the widget grid. The cards sit in a row and share the width
     evenly; "flex-wrap: wrap" drops them onto separate lines on a narrow phone.
     "flex: 1 1 240px" means: grow to share the space, shrink if needed, and start from
     240px — below that there isn't room for two, so they stack. */
  .scores-strip {
    display: flex; flex-wrap: wrap; gap: 0.75rem; margin: 0 0 1.4rem;
  }
  .score-card {
    flex: 1 1 240px; min-width: 0;
    background: rgba(255, 255, 255, 0.85); border: 1px solid #d7e2ec;
    border-radius: 10px; padding: 0.55rem 0.75rem;
  }
  .score-head { display: flex; align-items: baseline; gap: 0.5rem; margin-bottom: 0.4rem; }
  .score-team { font-weight: 700; color: #23384b; font-size: 0.95rem; }
  /* Record and league position, pushed to the right-hand end of the heading. */
  .score-record { font-size: 0.7rem; color: #6a819a; margin-left: auto; text-align: right; }

  .score-line { display: flex; align-items: center; gap: 0.45rem; flex-wrap: wrap; }
  /* The little W / L / LIVE badge in front of the score. */
  .score-pill {
    font-size: 0.66rem; font-weight: 700; letter-spacing: 0.02em;
    border-radius: 999px; padding: 0.12rem 0.42rem;
    background: #e6edf4; color: #4a6076;
  }
  .score-win { background: #1a9e5f; color: #fff; }
  .score-loss { background: #d64545; color: #fff; }
  /* A game in progress. The slow pulse is what makes "this is happening now" obvious
     at a glance without needing to read the words. */
  .score-live { background: #d64545; color: #fff; animation: score-pulse 2s ease-in-out infinite; }
  @keyframes score-pulse { 50% { opacity: 0.45; } }
  /* Some people find moving things on a page uncomfortable, and browsers let them say
     so in their settings. This turns the pulse off for them. */
  @media (prefers-reduced-motion: reduce) {
    .score-live { animation: none; }
  }

  .score-nums { font-size: 1.15rem; font-weight: 700; color: #23384b; }
  .score-vs { font-size: 0.85rem; color: #33495e; }
  /* The date of a finished game, or the inning/quarter of a live one. */
  .score-when { font-size: 0.7rem; color: #6a819a; margin-left: auto; }
  .score-next { font-size: 0.75rem; color: #4a6076; margin-top: 0.3rem; }
  .score-empty { font-size: 0.8rem; color: #4a6076; }

  /* The earlier finished games under the newest one (added 2026-09-01 — Eli asked to see
     "the past three" rather than only the latest). They are deliberately smaller and
     dimmer than the top line: the card's job is still "what just happened / what is
     happening", and three full-sized scores stacked up would turn a one-glance strip into
     a wall of numbers. The newest result keeps the big type; these are history. */
  .score-past { margin-top: 0.35rem; display: flex; flex-direction: column; gap: 0.2rem; }
  .score-past .score-line { gap: 0.35rem; }
  .score-past .score-pill { font-size: 0.6rem; padding: 0.08rem 0.34rem; }
  .score-past .score-nums { font-size: 0.82rem; font-weight: 600; color: #4a6076; }
  .score-past .score-vs { font-size: 0.75rem; color: #4a6076; }
  .score-past .score-when { font-size: 0.66rem; }
  /* When the scores were really fetched. flex-basis:100% forces it onto its own line
     underneath the cards. */
  .score-stamp { flex-basis: 100%; font-size: 0.68rem; color: #6a819a; }

  /* Candle lighting / Havdalah (added 2026-11-09). Styled like a score card so the top of
     the page reads as one family of "coming up soon" items. A warm candle colour on the
     left edge sets it apart from the games. */
  .shabbat-strip {
    margin: 0 0 1.4rem; padding: 0.6rem 0.85rem; border-radius: 10px;
    background: rgba(255, 255, 255, 0.85); border: 1px solid #d7e2ec;
    border-left: 4px solid #e0a12b;
  }
  .shabbat-title { font-weight: 700; color: #23384b; font-size: 0.95rem; margin-bottom: 0.35rem; }
  .shabbat-row { display: flex; gap: 0.6rem; align-items: baseline; font-size: 0.9rem; color: #23384b; }
  .shabbat-day { color: #6a819a; font-size: 0.8rem; min-width: 6.5rem; }
  .shabbat-time { font-weight: 700; }
  .shabbat-note { color: #6a819a; font-size: 0.75rem; }
</style>
</head>
<body>
<div class="page-head">
<h1>Eli's Dashboard</h1>
<!-- One button to refresh everything the browser can fetch for itself. Since 2026-11-09,
     with the relay set up, that is the whole page; without it, only weather and scores —
     refreshLabel() in the script picks the honest wording. -->
<button id="refresh-btn" onclick="refreshAll()">Refresh weather &amp; scores &#8635;</button>
</div>

<!-- How old the data is, and whether forcing a rebuild would actually fetch anything new.
     Python (panels/freshness.py) fills in the times; the countdown ticks in the script
     at the bottom of this file. -->
__FRESHNESS__

<!-- The score keeper: Mariners and Seahawks. Sits above the widget grid, but since
     2026-11-09 each card only APPEARS when its team has a game soon (see
     teamCardShouldShow in the script) — Eli: "I just want that widget to be gone"
     otherwise. Built by Python (panels/scores.py) as empty shells, filled by the script. -->
__SCORES__

<!-- Candle lighting and Havdalah for the coming Shabbat or holiday (added 2026-11-09).
     Hidden until the day before candle lighting, then shown until Havdalah has passed —
     both times together, because Eli can't use his phone on Shabbat. Filled entirely by
     the script from Hebcal, which the browser may read directly. -->
<div class="shabbat-strip" id="shabbat-strip" hidden></div>

<!-- All widgets live in this grid so they sit side by side and each stays its own compact
     height. ORDER (Eli, 2026-11-09): YouTube, News, Stocks, then Weather last. -->
<div class="grid">

<!-- "New Videos": the last 3 days of YouTube uploads. Python fills in the video cards from
     the last build; the script merges in newer ones live through the Cloudflare relay. -->
<section class="panel youtube">
__YOUTUBE__
</section>

<!-- News: today's Google News headlines for each subject Eli watches, with a badge showing
     how many outlets carried the same story. Built by Python (panels/news.py) as the
     backup; the script redraws it live through the relay. -->
<section class="panel news">
__NEWS__
</section>

<!-- Stocks: the S&P 500 and the Nasdaq. Built by Python as the backup; the script replaces
     each row with live prices through the relay. -->
<section class="panel stocks">
__STOCKS__
</section>

<section class="panel weather">
  <h2>Weather · __LOCATION_NAME__</h2>
  <!-- Python fills this in when the file is built; the Refresh button refills it live. -->
  <div id="weather-body">
__WEATHER_BODY__
  </div>
</section>

<!-- (A "Watch Later" widget sat here until 2026-11-09; Eli had it removed.) -->

</div>

<script>
// ==================================================================
// Weather Update button (unchanged from before)
// ------------------------------------------------------------------
// This JavaScript runs in the browser (no install needed). It re-fetches the
// weather from Open-Meteo and rebuilds the weather card, so Eli gets the latest
// prediction without re-running the Python script. It MIRRORS build_weather_panel()
// in panels/weather.py — keep the two in sync.
// ==================================================================

// Eli's location, dropped in from the Python constants.
const LATITUDE = __LAT__;
const LONGITUDE = __LON__;

// Same emoji/words map as weather_label() in Python.
function weatherLabel(code) {
  if (code === 0) return ["☀️", "Clear"];
  if (code <= 2) return ["⛅", "Partly cloudy"];
  if (code === 3) return ["☁️", "Overcast"];
  if (code === 45 || code === 48) return ["🌫️", "Fog"];
  if (code >= 51 && code <= 57) return ["🌦️", "Drizzle"];
  if (code >= 61 && code <= 67) return ["🌧️", "Rain"];
  if (code >= 71 && code <= 77) return ["❄️", "Snow"];
  if (code >= 80 && code <= 82) return ["🌦️", "Showers"];
  if (code >= 85 && code <= 86) return ["❄️", "Snow showers"];
  if (code >= 95) return ["⛈️", "Thunderstorm"];
  return ["🌡️", "—"];
}

// Same "14:00" -> "2 PM" conversion as to_ampm() in Python.
function toAmPm(clock) {
  let h = parseInt(clock.slice(0, 2), 10);
  const suffix = h < 12 ? "AM" : "PM";
  h = h % 12;
  if (h === 0) h = 12;
  return h + " " + suffix;
}

// Build the weather HTML from Open-Meteo data. Mirrors build_weather_panel().
function buildWeatherHTML(data) {
  const current = data.current;
  const hourly = data.hourly;
  const times = hourly.time;
  const temps = hourly.temperature_2m;
  const rain = hourly.precipitation_probability;
  const codes = hourly.weather_code;

  // Find where "now" starts so we skip hours already gone.
  const currentHour = current.time.slice(0, 13) + ":00";
  let start = 0;
  while (start < times.length && times[start] < currentHour) start++;

  const [nowEmoji, nowText] = weatherLabel(current.weather_code);
  const updated = toAmPm(current.time.slice(11));
  const nowRain = (rain[start] === null || rain[start] === undefined) ? 0 : rain[start];

  let html = '<p class="updated">Updated ' + updated + '</p>';
  html += '<div class="hero">';
  html += '<div class="hero-emoji">' + nowEmoji + '</div>';
  html += '<div class="hero-main">';
  html += '<div class="hero-temp">' + Math.round(current.temperature_2m) + '°</div>';
  html += '<div class="hero-cond">' + nowText + '</div>';
  html += '<div class="hero-rain">Rain ' + nowRain + '%</div>';
  html += '</div></div>';

  html += '<div class="hours">';
  let currentDay = "";
  for (let i = start; i < start + 24 && i < times.length; i++) {
    const dayPart = times[i].slice(0, 10);
    const clockPart = times[i].slice(11);
    if (dayPart !== currentDay) {
      html += '<div class="day-label">' + dayPart + '</div>';
      currentDay = dayPart;
    }
    const [emoji] = weatherLabel(codes[i]);
    const r = (rain[i] === null || rain[i] === undefined) ? 0 : rain[i];
    html += '<div class="hour">';
    html += '<div class="hour-time">' + toAmPm(clockPart) + '</div>';
    html += '<div class="hour-emoji">' + emoji + '</div>';
    html += '<div class="hour-temp">' + Math.round(temps[i]) + '°</div>';
    html += '<div class="hour-rain">' + r + '%</div>';
    html += '</div>';
  }
  html += '</div>';
  return html;
}

// Re-fetch the weather from Open-Meteo and rebuild just the weather card.
async function refreshWeather() {
  const body = document.getElementById("weather-body");
  try {
    const url = "https://api.open-meteo.com/v1/forecast"
      + "?latitude=" + LATITUDE
      + "&longitude=" + LONGITUDE
      + "&current=temperature_2m,weather_code"
      + "&hourly=temperature_2m,precipitation_probability,weather_code"
      + "&temperature_unit=fahrenheit"
      + "&timezone=America/Los_Angeles";
    const response = await fetch(url);
    const data = await response.json();
    body.innerHTML = buildWeatherHTML(data);
  } catch (e) {
    // Fail soft, just like the Python side.
    body.innerHTML = "<p>Could not update weather right now.</p>";
  }
}

// The Refresh button. It refreshes every widget that CAN update live in the browser:
// weather, the score cards (since 2026-09-01), and YouTube videos (since 2026-11-09, but
// ONLY once the Cloudflare relay's address is in config.json).
//
// WHY IT NAMES WHAT IT REFRESHES RATHER THAN JUST SAYING "Refresh": Eli's own words
// were that the button was "kind of stupid because to my knowledge it only refreshes the
// weather", and he was exactly right. Stocks and news are baked into the page by Python
// when the file is built, so nothing the browser does can update them — the only way to
// refresh those is a rebuild, which is what the "Run a rebuild" link in the freshness
// strip is for. A button labelled just "Refresh" quietly promises more than it can
// deliver, so it names the things it genuinely does — and refreshLabel() only adds
// "videos" when the relay is actually set up.
// Since the second round on 2026-11-09, with the relay set up, EVERY widget refreshes
// live — videos, news and stocks through the relay; weather, scores and candle lighting
// directly — so the button can honestly say "everything".
function refreshLabel() {
  const box = document.getElementById("yt-live-config");
  const hasRelay = !!(box && box.dataset.relay);
  return hasRelay ? "Refresh everything &#8635;"
                  : "Refresh weather &amp; scores &#8635;";
}

// The fetches are started TOGETHER with Promise.all rather than one after the other, so
// pressing the button costs about as long as the slowest one instead of the sum.
async function refreshAll() {
  const btn = document.getElementById("refresh-btn");
  btn.disabled = true;
  btn.innerHTML = "Refreshing…";
  await Promise.all([refreshWeather(), refreshScores(), refreshShabbat(),
                     refreshYouTube(), refreshNews(), refreshStocks()]);
  btn.disabled = false;
  btn.innerHTML = refreshLabel();
}

// ==================================================================
// The score keeper (Mariners / Seahawks)
// ------------------------------------------------------------------
// These cards are fetched HERE, in the browser, not by Python when the page is built.
// The full reasoning is at the top of panels/scores.py; the short version is that ESPN
// refuses GitHub's build machines (the panel read "Scores unavailable right now." on the
// live page for four weeks) but answers a browser perfectly well, and a score baked in at
// build time is only as fresh as the last rebuild — which can be twelve hours ago.
//
// Everything below is a close translation of the Python that used to do this job. That
// code had been checked against three genuinely live games, so translating it is safer
// than writing a fresh guess at how ESPN shapes its replies. The comments explaining
// ESPN's quirks are kept with the code that has to cope with them.

// The address every request here starts from.
const ESPN_BASE = "https://site.api.espn.com/apis/site/v2/sports/";

// Everything on this dashboard is shown in Pacific time, whatever the phone is set to.
const SCORES_TZ = "America/Los_Angeles";

// Turn a moment into "2026-09-01" AS IT WAS IN PACIFIC. Doing this with Intl rather than
// with the Date object's own getDate()/getMonth() matters: those answer in whatever time
// zone the viewer's device is set to, so a 7:10 PM Pacific game would land on the wrong
// calendar day for anyone east of us — and "Today" is exactly the kind of word that must
// not be wrong. "en-CA" is used because it formats dates as YYYY-MM-DD, which sorts and
// compares as plain text.
function pacificYmd(date) {
  return new Intl.DateTimeFormat("en-CA", {
    timeZone: SCORES_TZ, year: "numeric", month: "2-digit", day: "2-digit"
  }).format(date);
}

// "7:10 PM" in Pacific.
function pacificClock(date) {
  return new Intl.DateTimeFormat("en-US", {
    timeZone: SCORES_TZ, hour: "numeric", minute: "2-digit", hour12: true
  }).format(date);
}

// "Mon Sep 1" in Pacific. The replace strips the comma en-US puts after the weekday,
// so it matches the wording the Python version used.
function pacificDayLabel(date) {
  return new Intl.DateTimeFormat("en-US", {
    timeZone: SCORES_TZ, weekday: "short", month: "short", day: "numeric"
  }).format(date).replace(",", "");
}

// How many calendar days ahead a moment is, counted in Pacific days. Both sides are
// turned into a Pacific YYYY-MM-DD first and only then into a date, so the answer is a
// whole number of days and never depends on the time of day or on the viewer's zone.
function pacificDaysAway(date) {
  const asDay = function (text) {
    const parts = text.split("-");
    return Date.UTC(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
  };
  const oneDay = 24 * 60 * 60 * 1000;
  return Math.round((asDay(pacificYmd(date)) - asDay(pacificYmd(new Date()))) / oneDay);
}

// "Today 7:10 PM" / "Tomorrow 1:05 PM" / "Sat Sep 5 6:40 PM" for a game still to come.
// Worked out when the card is drawn, never stored, so it cannot be left saying "Today"
// about yesterday on a tab that has been open overnight.
function whenLabel(date) {
  if (!date) { return ""; }
  const daysAway = pacificDaysAway(date);
  if (daysAway === 0) { return "Today " + pacificClock(date); }
  if (daysAway === 1) { return "Tomorrow " + pacificClock(date); }
  return pacificDayLabel(date) + " " + pacificClock(date);
}

// Pull one team's score out of one of ESPN's "competitor" records (a competitor is one of
// the two teams in a game).
//
// ESPN writes the score in TWO different shapes depending on which address it came from,
// so this has to cope with both:
//   * the /schedule address, finished game -> {"value": 4.0, "displayValue": "4"}
//   * the /scoreboard address, live game   -> "4"   (just a plain piece of text)
// A game that has not started carries no score at all, and returns null here, which tells
// the card to leave the numbers off.
function scoreOf(side) {
  const score = side.score;
  if (score === null || score === undefined) { return null; }
  if (typeof score === "object") {
    return score.displayValue === undefined ? null : String(score.displayValue);
  }
  return String(score);
}

// Reduce one of ESPN's game records down to the handful of facts a card needs.
// Returns null if the record is not shaped the way we expect, so one odd entry in a
// 162-game season cannot take the whole card down with it.
function readGame(event, ourAbbreviation) {
  const competitions = event.competitions || [];
  if (!competitions.length) { return null; }
  const competition = competitions[0];

  const competitors = competition.competitors || [];
  if (competitors.length !== 2) { return null; }

  // Work out which of the two is our team and which is the opponent.
  let ours = null;
  let theirs = null;
  competitors.forEach(function (side) {
    const abbreviation = (side.team || {}).abbreviation;
    if (abbreviation === ourAbbreviation) { ours = side; } else { theirs = side; }
  });
  if (!ours || !theirs) { return null; }

  // "status.type.state" is ESPN's word for where the game is up to:
  //   "pre" = not started yet, "in" = being played now, "post" = finished.
  const statusType = ((competition.status || {}).type) || {};

  return {
    state: statusType.state,
    // "shortDetail" is ESPN's own summary of the moment: "Final", "Bot 7th", "Q3 5:42".
    detail: statusType.shortDetail || statusType.description || "",
    opponent: (theirs.team || {}).shortDisplayName || "",
    // Whether WE are the home team, so the card can say "vs" or "@".
    atHome: ours.homeAway === "home",
    ourScore: scoreOf(ours),
    theirScore: scoreOf(theirs),
    // true/false on a finished game, undefined before it is played.
    won: ours.winner,
    // new Date() understands ESPN's "2026-09-01T22:45Z" as written.
    startsAt: event.date ? new Date(event.date) : null
  };
}

// Get the score of a game being played RIGHT NOW.
//
// WHY THIS EXISTS (found 2026-08-04, after Eli saw a LIVE badge with no numbers beside
// it): the /schedule address — the one that gives us the season, the finished games and
// the fixtures — does NOT carry a score while a game is in progress. Checked against four
// teams that were mid-game at the time, and the team's record in that reply has no score
// field at all until the game finishes. The badge and the inning showed up (those come
// from the status, which IS there) and the score silently did not.
//
// The live numbers live at a different address, /scoreboard, which lists today's games
// across the whole league. It is only asked for when a game is actually on, so an
// ordinary day costs one request per team.
async function fetchLiveScore(sport, league, ourAbbreviation) {
  const response = await fetch(ESPN_BASE + sport + "/" + league + "/scoreboard");
  if (!response.ok) { throw new Error("HTTP " + response.status); }
  const data = await response.json();

  const events = data.events || [];
  for (let i = 0; i < events.length; i++) {
    const competitions = events[i].competitions || [];
    if (!competitions.length) { continue; }
    const competition = competitions[0];

    let ours = null;
    let theirs = null;
    (competition.competitors || []).forEach(function (side) {
      const abbreviation = (side.team || {}).abbreviation;
      if (abbreviation === ourAbbreviation) { ours = side; } else { theirs = side; }
    });
    if (!ours || !theirs) { continue; }

    // Only take the score from a game that really is in progress. If the scoreboard says
    // the game has already finished, the schedule's own finished-game record is the
    // better source and we leave it alone.
    const statusType = ((competition.status || {}).type) || {};
    if (statusType.state !== "in") { continue; }

    return {
      ourScore: scoreOf(ours),
      theirScore: scoreOf(theirs),
      // The scoreboard's own "Bot 7th" wording, a moment fresher than the schedule's copy.
      detail: statusType.shortDetail || ""
    };
  }
  return null;
}

// "vs Dodgers" when we are at home, "@ Dodgers" when we are away.
function opponentLabel(game) {
  return (game.atHome ? "vs " : "@ ") + game.opponent;
}

// Build the one line of a card that carries a score, as real elements rather than as a
// string of HTML. Everything from ESPN goes in through textContent, so a team name could
// never smuggle markup onto the page — the same habit the live YouTube and news cards follow.
function renderGameLine(game, isLive) {
  const line = document.createElement("div");
  line.className = "score-line";

  // A drawn game has to be spotted by comparing the scores, NOT by trusting the winner
  // flag. ESPN marks BOTH teams "winner: false" in a tie, which is indistinguishable from
  // a loss if you only look at our own side — found 2026-09-01 on a real game, Seahawks
  // 9-9 at the Chiefs, which was rendering as an "L".
  const isTie = !isLive
    && game.ourScore !== null && game.theirScore !== null
    && game.ourScore === game.theirScore;

  const pill = document.createElement("span");
  pill.className = "score-pill";
  if (isLive) {
    pill.className += " score-live";
    pill.textContent = "LIVE";
  } else if (isTie) {
    pill.textContent = "T";
  } else if (game.won === true) {
    pill.className += " score-win";
    pill.textContent = "W";
  } else if (game.won === false) {
    pill.className += " score-loss";
    pill.textContent = "L";
  } else {
    // A finished game with no winner recorded and no scores — usually a postponement.
    pill.innerHTML = "&mdash;";
  }
  line.appendChild(pill);

  // The score itself, our number first so it reads the way Eli would say it.
  if (game.ourScore !== null && game.theirScore !== null) {
    const nums = document.createElement("span");
    nums.className = "score-nums";
    nums.textContent = game.ourScore + "–" + game.theirScore;   // en dash
    line.appendChild(nums);
  }

  const versus = document.createElement("span");
  versus.className = "score-vs";
  versus.textContent = opponentLabel(game);
  line.appendChild(versus);

  // For a live game the inning/quarter matters; for a finished one the date does.
  const trailing = isLive
    ? (game.detail || "")
    : (game.startsAt ? pacificDayLabel(game.startsAt) : "");
  if (trailing) {
    const when = document.createElement("span");
    when.className = "score-when";
    when.textContent = trailing;
    line.appendChild(when);
  }

  return line;
}

// Fetch one team and fill in its card. Each card is on its own: one team failing must
// never cost the other, which is why the caller wraps each call separately.
async function loadTeamCard(card, pastGamesShown) {
  const sport = card.dataset.sport;
  const league = card.dataset.league;
  const team = card.dataset.team;

  const body = card.querySelector(".score-body");
  const recordSpan = card.querySelector(".score-record");

  const response = await fetch(ESPN_BASE + sport + "/" + league + "/teams/" + team + "/schedule");
  if (!response.ok) { throw new Error("HTTP " + response.status); }
  const data = await response.json();

  // The reply's own "team" block carries the season record and the league position.
  const teamBlock = data.team || {};
  const ourAbbreviation = teamBlock.abbreviation || team.toUpperCase();

  // Sort every game in the season into finished / playing now / still to come.
  const played = [];
  let playingNow = null;
  const upcoming = [];
  (data.events || []).forEach(function (event) {
    const game = readGame(event, ourAbbreviation);
    if (!game) { return; }
    if (game.state === "post") { played.push(game); }
    else if (game.state === "in") { playingNow = game; }
    else if (game.state === "pre") { upcoming.push(game); }
  });

  // WHEN ESPN HANDS BACK THE WRONG SEASON (found 2026-09-01 against the real Seahawks).
  // That address answers with whichever part of the season ESPN considers current, and in
  // early September for the NFL that is still the PRESEASON: three finished exhibition
  // games and nothing at all coming up. The card was showing three preseason results and
  // no "Next:" line, on the very weekend Eli would be looking for the season opener.
  //
  // Asking again with "?seasontype=2" — ESPN's number for the regular season — returns the
  // real 17-game fixture list (verified: NE @ SEA on Sep 10, through to the Rams in
  // January). This only runs when the first reply had NOTHING upcoming, so on any ordinary
  // day, in any sport, it costs no extra request at all. Wrapped on its own: if the second
  // ask fails we simply keep what the first one gave us.
  if (!upcoming.length) {
    try {
      const seasonResponse = await fetch(
        ESPN_BASE + sport + "/" + league + "/teams/" + team + "/schedule?seasontype=2");
      if (seasonResponse.ok) {
        const seasonData = await seasonResponse.json();
        (seasonData.events || []).forEach(function (event) {
          const game = readGame(event, ourAbbreviation);
          if (game && game.state === "pre") { upcoming.push(game); }
        });
      }
    } catch (e) {
      // Keep whatever the first reply gave us.
    }
  }

  // A game in progress arrives from the address above with NO score on it (see
  // fetchLiveScore), so go and get the numbers separately. Wrapped on its own: if the
  // scoreboard is down we still show the LIVE badge and the inning, just without a
  // score — a worse card, but far better than losing it entirely.
  if (playingNow) {
    try {
      const liveScore = await fetchLiveScore(sport, league, ourAbbreviation);
      if (liveScore) {
        playingNow.ourScore = liveScore.ourScore;
        playingNow.theirScore = liveScore.theirScore;
        if (liveScore.detail) { playingNow.detail = liveScore.detail; }
      }
    } catch (e) {
      // No numbers, but keep the card.
    }
  }

  // The record and where the team sits in its division, e.g. "64-74 · 3rd in AL West".
  // Only shown once the season has games played: out of season ESPN still reports LAST
  // season's record, and the Seahawks reading "14-3" beside a September fixture would
  // look like this year's result.
  recordSpan.textContent = "";
  if (played.length > 0 && teamBlock.recordSummary) {
    let recordText = teamBlock.recordSummary;
    if (teamBlock.standingSummary) {
      recordText += " · " + teamBlock.standingSummary;     // a middle dot
    }
    recordSpan.textContent = recordText;
  }

  // Now rebuild everything under the heading.
  body.innerHTML = "";

  // A game happening right now beats everything else — that is the whole point of the
  // strip. The newest finished result takes the top line otherwise.
  //
  // "played" comes back from ESPN in date order, so the newest finished game is the LAST
  // one. .slice(-n) takes the final n entries and .reverse() puts the newest first.
  const recent = played.slice(-pastGamesShown).reverse();

  if (playingNow) {
    body.appendChild(renderGameLine(playingNow, true));
  } else if (recent.length) {
    body.appendChild(renderGameLine(recent.shift(), false));
  }

  // Whatever results are left go underneath in the smaller history list (Eli asked to see
  // "the past three" rather than only the latest). When a game is live, all three recent
  // results sit here; otherwise the newest one is already the big line above.
  if (recent.length) {
    const past = document.createElement("div");
    past.className = "score-past";
    recent.forEach(function (game) { past.appendChild(renderGameLine(game, false)); });
    body.appendChild(past);
  }

  // And always say what's next, so the card is useful on a day with no game.
  if (upcoming.length) {
    const next = document.createElement("div");
    next.className = "score-next";
    next.textContent = "Next: " + opponentLabel(upcoming[0])
      + " · " + whenLabel(upcoming[0].startsAt);
    body.appendChild(next);
  } else if (!playingNow && !played.length) {
    const none = document.createElement("div");
    none.className = "score-empty";
    none.textContent = "No games scheduled.";
    body.appendChild(none);
  }

  // Finally: should this card be on the page at all right now? (see below)
  card.hidden = !teamCardShouldShow(card, playingNow, played, upcoming);
}

// WHEN A TEAM'S CARD SHOWS (Eli, 2026-11-09): only when there is a game SOON. Otherwise
// the card is gone entirely — he did not want an off-season or an off-day card sitting at
// the top of the page. "Soon" is per team, from show_within_hours in config.json (handed
// over as data-show-within-hours): 24 hours for the Mariners, 168 (a week) for the
// Seahawks, since football plays once a week and a 24-hour rule would hide the card for
// most of the season. A card also shows while a game is live, and for 16 hours after the
// last game STARTED (roughly: through the evening after it ends), so the final score is
// still there to see.
const JUST_PLAYED_HOURS = 16;

function teamCardShouldShow(card, playingNow, played, upcoming) {
  const now = Date.now();
  const hour = 3600 * 1000;
  if (playingNow) { return true; }
  const withinHours = Number(card.dataset.showWithinHours) || 24;
  // ESPN lists games in date order, so the first upcoming one is the soonest.
  const next = upcoming.length ? upcoming[0].startsAt : null;
  if (next && next.getTime() - now <= withinHours * hour) { return true; }
  const last = played.length ? played[played.length - 1].startsAt : null;
  if (last && now - last.getTime() <= JUST_PLAYED_HOURS * hour) { return true; }
  return false;
}

// Refresh every score card. Called once when the page loads, and again whenever Eli
// presses the Refresh button.
async function refreshScores() {
  const strip = document.getElementById("scores-strip");
  if (!strip) { return; }              // no teams configured; nothing to do
  const cards = strip.querySelectorAll(".score-card");
  const stamp = document.getElementById("score-stamp");

  // How many finished games to list, handed over by Python so the number lives in one
  // place (PAST_GAMES_SHOWN in panels/scores.py).
  const pastGamesShown = Number(strip.dataset.pastGames) || 3;

  // Both teams are fetched at the same time rather than one after the other. Each is
  // wrapped in its own catch so a failure becomes one card saying so, not a thrown error
  // that leaves the other card stuck on "Loading scores…" forever.
  await Promise.all(Array.prototype.map.call(cards, async function (card) {
    try {
      await loadTeamCard(card, pastGamesShown);
    } catch (e) {
      const body = card.querySelector(".score-body");
      body.innerHTML = "";
      const note = document.createElement("div");
      note.className = "score-empty";
      note.textContent = "Scores unavailable right now.";
      body.appendChild(note);
      // We can't tell whether a game is soon, so say so rather than silently hiding it.
      card.hidden = false;
    }
  }));

  // The strip itself (with its "As of" stamp) only shows when at least one card does.
  strip.hidden = !strip.querySelector(".score-card:not([hidden])");

  // The stamp says when the BROWSER fetched, which on this design is a truer answer than
  // the old build-time stamp: these numbers are as new as the moment you are reading them.
  if (stamp) {
    stamp.textContent = "As of " + pacificClock(new Date()) + " · refreshes when you reload";
  }
}

// ==================================================================
// YouTube widget: "New Videos" deletions
// ------------------------------------------------------------------
// A static HTML file has no server to remember things between runs, so we use the
// browser's built-in localStorage — a small per-browser box that survives page
// reloads. We keep in it which videos Eli has ✕'d (so a ✕ sticks — since 2026-11-09, for
// good, not just for the rest of the day).
// (A "Watch Later" list was kept here too until 2026-11-09, when Eli had it removed. Its
// saved data, under "yt_watch_later_v1", is simply left alone in the browser.)
// ==================================================================

// The names we store our things under. The "_v1"/"_v2" suffix lets us change the shape
// later without clashing with old saved data.
// v2 (2026-11-09): { videoId: when it was ✕'d, in ms }. v1 was { "2026-11-09": [ids] },
// which forgot everything at midnight. See getDismissed() for how v1 is carried over.
const DISMISS_KEY = "yt_dismissed_v2";
const OLD_DISMISS_KEY = "yt_dismissed_v1";

// Today's date as "YYYY-MM-DD" in Pacific — matches the date the Python side used to
// pick today's videos. "en-CA" happens to format dates as YYYY-MM-DD; timeZone pins
// it to Pacific no matter what the laptop's own clock is set to.
function todayStr() {
  return new Date().toLocaleDateString("en-CA", { timeZone: "America/Los_Angeles" });
}

// Read a JSON value out of localStorage, returning a fallback if it's missing or junk.
function loadJSON(key, fallback) {
  try {
    const saved = localStorage.getItem(key);
    return saved ? JSON.parse(saved) : fallback;
  } catch (e) {
    return fallback;
  }
}

// --- Dismissed-video storage ---
// How long the list may reach back, in hours. Python hands this over (RECENT_HOURS in
// panels/youtube.py) so the two can never disagree; 72 is only a fallback.
function windowHours() {
  const box = document.getElementById("yt-live-config");
  return (box && Number(box.dataset.windowHours)) || 72;
}

// Every video Eli has ✕'d, as { videoId: whenDismissedMs }.
function getDismissed() {
  const dismissed = loadJSON(DISMISS_KEY, {});
  // One-time carry-over from the old day-keyed list, so the switch to v2 does not bring
  // back today's already-✕'d videos. Read it, copy its ids across, then delete it.
  const old = loadJSON(OLD_DISMISS_KEY, null);
  if (old) {
    Object.keys(old).forEach(function (day) {
      (old[day] || []).forEach(function (vid) {
        if (!dismissed[vid]) dismissed[vid] = Date.now();
      });
    });
    try { localStorage.removeItem(OLD_DISMISS_KEY); } catch (e) {}
    setDismissed(dismissed);
  }
  return dismissed;
}

function setDismissed(dismissed) {
  // Forget a dismissal once its video is certainly too old to be shown anyway: it was
  // ✕'d after it was published, so once the ✕ is older than the window (plus a day of
  // slack) the video is too. Without this the list would grow for ever.
  const forgetBefore = Date.now() - (windowHours() + 24) * 3600 * 1000;
  const kept = {};
  Object.keys(dismissed).forEach(function (vid) {
    if (dismissed[vid] >= forgetBefore) kept[vid] = dismissed[vid];
  });
  try { localStorage.setItem(DISMISS_KEY, JSON.stringify(kept)); } catch (e) {}
}

// Dismiss one video, given the CARD itself: hide it and remember it. Split out from
// dismissToday below so the "clear it when you click it" handler can reuse it — that one
// starts from a link, not from the ✕ button. (The names still say "Today" because the
// list used to be "New Today"; renaming them would touch every caller for no gain.)
function dismissTodayCard(card) {
  if (!card) return;
  const vid = card.dataset.vid;           // its video id (from the data-vid attribute)
  const dismissed = getDismissed();
  if (!dismissed[vid]) {
    dismissed[vid] = Date.now();
    setDismissed(dismissed);
  }
  card.remove();          // take it off the page now
  updateTodayEmpty();     // maybe show the "all caught up" note
}

// The ✕ button's version: work out which card it belongs to, then do the same thing.
function dismissToday(btn) {
  dismissTodayCard(btn.closest(".yt-card"));
}

// Clicking a video's thumbnail or title opens it AND takes it off the list — Eli asked for
// a video to clear once he's clicked it.
//
// This does NOT call preventDefault, so the link still opens in a new tab exactly as
// before; we only tidy up behind it. The tidying is wrapped in a 0-millisecond setTimeout
// so it happens just AFTER the browser has finished handling the click: pulling a link out
// of the page while its own click is still being processed can cancel the new tab in some
// browsers. A 0ms wait is long enough to be safe and far too short to see.
function clearOnOpen(el) {
  const card = el.closest(".yt-card");
  if (!card) return;
  setTimeout(function () {
    dismissTodayCard(card);
  }, 0);
}

// On page load, hide any videos Eli already ✕'d, and any that have aged out of the window
// since the build drew them (a page built 2 days ago may hold cards older than 3 days now).
function applyDismissed() {
  const dismissed = getDismissed();
  const list = document.getElementById("yt-today-list");
  if (!list) return;
  const cutoff = Date.now() / 1000 - windowHours() * 3600;
  for (const card of list.querySelectorAll(".yt-card")) {
    const published = Number(card.dataset.published);
    if (dismissed[card.dataset.vid] || (published && published < cutoff)) card.remove();
  }
  updateTodayEmpty();
}

// ==================================================================
// Live YouTube, through the Cloudflare relay (added 2026-11-09)
// ------------------------------------------------------------------
// The cards Python drew are only as new as the last build, and the evening builds are
// slow and miss channels because YouTube throttles GitHub's shared machines. So, as soon
// as the page opens (and whenever Refresh is pressed), we ask YouTube again from HERE.
//
// A browser is not allowed to read YouTube's feed directly — YouTube does not send the
// permission header — so each request goes to our relay (relay/worker.js, on Cloudflare),
// which fetches the feed and passes it back with that permission added.
//
// Nothing is lost if the relay is down or a channel fails: we MERGE the live videos into
// the build's cards rather than replacing them, so a channel the relay could not reach
// simply keeps what the build had for it.

// Draw one "New Videos" card. Built from real elements with textContent (never innerHTML)
// for the title and channel, so a video title can never inject HTML. The shape — classes,
// data-* attributes, buttons — matches the cards panels/youtube.py writes exactly, so the
// ✕ and click-to-clear work the same on both.
function buildNewVideoCard(v) {
  const card = document.createElement("div");
  card.className = "yt-card";
  card.dataset.vid = v.video_id;
  card.dataset.title = v.title;
  card.dataset.url = v.url;
  card.dataset.thumb = v.thumbnail;
  card.dataset.channel = v.channel;
  card.dataset.published = String(v.published_epoch);

  const thumbLink = document.createElement("a");
  thumbLink.className = "yt-thumb-link";
  thumbLink.href = v.url; thumbLink.target = "_blank"; thumbLink.rel = "noopener";
  thumbLink.onclick = function () { clearOnOpen(this); };
  const img = document.createElement("img");
  img.className = "yt-thumb"; img.src = v.thumbnail; img.alt = ""; img.loading = "lazy";
  thumbLink.appendChild(img);

  const meta = document.createElement("div");
  meta.className = "yt-meta";
  const title = document.createElement("a");
  title.className = "yt-title";
  title.href = v.url; title.target = "_blank"; title.rel = "noopener";
  title.onclick = function () { clearOnOpen(this); };
  title.textContent = v.title;
  const chan = document.createElement("div");
  chan.className = "yt-channel";
  chan.textContent = v.channel;

  const actions = document.createElement("div");
  actions.className = "yt-actions";
  const remove = document.createElement("button");
  remove.className = "yt-remove"; remove.title = "Remove";
  remove.innerHTML = "&#10005;";
  remove.onclick = function () { dismissToday(this); };
  actions.appendChild(remove);

  meta.appendChild(title);
  meta.appendChild(chan);
  meta.appendChild(actions);
  card.appendChild(thumbLink);
  card.appendChild(meta);
  return card;
}

// Read the video details back off a card (the build's or ours) into a plain object.
function videoFromCard(card) {
  return {
    video_id: card.dataset.vid,
    title: card.dataset.title,
    url: card.dataset.url,
    thumbnail: card.dataset.thumb,
    channel: card.dataset.channel,
    published_epoch: Number(card.dataset.published) || 0
  };
}

// Ask the relay for ONE channel's feed and turn its XML into video objects shaped like
// the ones Python saves (see entry_to_video in panels/youtube.py). Throws on failure, so
// the caller can count which channels answered.
async function fetchChannelLive(relay, channel) {
  // Strip any trailing "/" from the address in config.json so either spelling works.
  const address = relay.replace(/\/+$/, "") + "/?channel_id=" + encodeURIComponent(channel.channel_id);
  const reply = await fetch(address);
  if (!reply.ok) throw new Error("relay answered " + reply.status);
  // DOMParser is the browser's built-in XML reader — the JavaScript cousin of feedparser.
  const xml = new DOMParser().parseFromString(await reply.text(), "text/xml");
  const videos = [];
  for (const entry of xml.getElementsByTagName("entry")) {
    // "yt:videoId" is the feed's own name for the video id field.
    const idEl = entry.getElementsByTagName("yt:videoId")[0];
    const publishedEl = entry.getElementsByTagName("published")[0];
    if (!idEl || !publishedEl) continue;          // skip anything missing an id or a date
    const vid = idEl.textContent.trim();
    const titleEl = entry.getElementsByTagName("title")[0];
    const linkEl = entry.getElementsByTagName("link")[0];
    videos.push({
      video_id: vid,
      title: titleEl ? titleEl.textContent : "(untitled)",
      url: (linkEl && linkEl.getAttribute("href")) || "https://www.youtube.com/watch?v=" + vid,
      thumbnail: "https://i.ytimg.com/vi/" + vid + "/hqdefault.jpg",
      channel: channel.name,
      // Date.parse reads the feed's "2026-11-09T20:00:37+00:00"; /1000 makes it seconds,
      // the same unit Python uses.
      published_epoch: Math.floor(Date.parse(publishedEl.textContent) / 1000)
    });
  }
  return videos;
}

// Fetch every channel live, merge with what is on the page, and redraw the list.
async function refreshYouTube() {
  const configBox = document.getElementById("yt-live-config");
  const list = document.getElementById("yt-today-list");
  const stamp = document.getElementById("yt-stamp");
  if (!configBox || !list) return;            // the panel failed soft — nothing to do
  const relay = configBox.dataset.relay;
  if (!relay) return;                         // no relay set up yet: build's cards only
  const channels = JSON.parse(configBox.dataset.channels || "[]");

  if (stamp) stamp.textContent = "Checking YouTube…";

  // Ask for every channel at once. A channel that fails gives null instead of stopping
  // the others (that is what the .catch does).
  const answers = await Promise.all(channels.map(function (channel) {
    return fetchChannelLive(relay, channel).catch(function () { return null; });
  }));

  // Start from the cards already on the page, then add the live videos. Keyed by video
  // id, so a video in both just appears once.
  const byId = {};
  list.querySelectorAll(".yt-card").forEach(function (card) {
    byId[card.dataset.vid] = videoFromCard(card);
  });
  let answered = 0;
  answers.forEach(function (videos) {
    if (videos === null) return;
    answered += 1;
    videos.forEach(function (v) { byId[v.video_id] = v; });
  });

  // Keep only videos inside the window that Eli has not ✕'d, newest first.
  const dismissed = getDismissed();
  const cutoff = Date.now() / 1000 - windowHours() * 3600;
  const shown = Object.keys(byId).map(function (vid) { return byId[vid]; })
    .filter(function (v) { return v.published_epoch >= cutoff && !dismissed[v.video_id]; })
    .sort(function (a, b) { return b.published_epoch - a.published_epoch; });

  // Redraw, keeping the scroll position so a refresh does not throw you back to the top.
  const scrolledTo = list.scrollTop;
  list.innerHTML = "";
  shown.forEach(function (v) { list.appendChild(buildNewVideoCard(v)); });
  list.scrollTop = scrolledTo;
  updateTodayEmpty();

  // Say honestly how the check went.
  if (stamp) {
    const when = pacificClock(new Date());
    if (answered === channels.length) {
      stamp.textContent = "Live · checked " + when + " · all " + channels.length + " channels";
    } else if (answered > 0) {
      stamp.textContent = "Live · checked " + when + " · " + answered + " of " + channels.length
                        + " channels answered (the rest from the last build)";
    } else {
      stamp.textContent = "Couldn't reach YouTube at " + when + " · showing the last build's videos";
    }
  }
}

// Show an "all caught up" note if the New Today list has no visible cards left.
function updateTodayEmpty() {
  const list = document.getElementById("yt-today-list");
  if (!list) return;
  const hasCards = list.querySelector(".yt-card");
  let note = list.querySelector(".yt-empty");
  if (!hasCards) {
    if (!note) {
      note = document.createElement("p");
      note.className = "yt-empty";
      list.appendChild(note);
    }
    note.textContent = "All caught up.";
  } else if (note) {
    note.remove();
  }
}

// ==================================================================
// News widget: per-story ✕ delete (today-only, clean slate each day)
// ------------------------------------------------------------------
// Works just like the YouTube "New Today" deletions: the ids of the stories you dismiss
// are kept in localStorage under TODAY's date only, so a ✕ sticks for the rest of today
// (across reloads and rebuilds) and a new day forgets them — a clean slate. We reuse the
// same todayStr() and loadJSON() helpers defined above.
// ==================================================================

const NEWS_DISMISS_KEY = "news_dismissed_v1";

// The story ids dismissed today (stored under today's date only).
function getDismissedNewsToday() {
  const all = loadJSON(NEWS_DISMISS_KEY, {});
  return all[todayStr()] || [];
}
function setDismissedNewsToday(ids) {
  // Keep ONLY today's list, dropping any other date — that is what makes each new day
  // start fresh (same trick as the YouTube dismissals).
  const obj = {};
  obj[todayStr()] = ids;
  localStorage.setItem(NEWS_DISMISS_KEY, JSON.stringify(obj));
}

// Dismiss one story: hide its row and remember it for the rest of today.
function dismissNews(btn) {
  const story = btn.closest(".news-story");
  const id = story.dataset.newsid;          // the story's link, used as its id
  const ids = getDismissedNewsToday();
  if (!ids.includes(id)) {
    ids.push(id);
    setDismissedNewsToday(ids);
  }
  const group = story.closest(".news-subject");
  story.remove();                 // take it off the page now
  updateNewsSubjectEmpty(group);  // maybe show "Nothing today." for this subject
}

// Clear EVERY headline showing under one subject, in one press.
//
// This is deliberately just the per-story ✕ done to all of them at once: each story's id
// goes into the same today-only dismissed list. That matters, because it is what makes the
// subject keep working afterwards — a story is remembered by its LINK, so the headlines on
// screen now stay gone, while any NEW story that turns up in a later rebuild has a
// different link and comes through normally. The subject heading stays put either way.
function clearNewsSubject(btn) {
  const group = btn.closest(".news-subject");
  if (!group) return;
  const ids = getDismissedNewsToday();
  for (const story of group.querySelectorAll(".news-story")) {
    const id = story.dataset.newsid;
    if (!ids.includes(id)) ids.push(id);
    story.remove();
  }
  setDismissedNewsToday(ids);      // save once, after removing them all
  updateNewsSubjectEmpty(group);   // show "Nothing today." in the space they left
}

// If a subject group has no stories left, show a short "Nothing today." note (once) and
// hide its ✕, since at that point there is nothing left for it to clear.
function updateNewsSubjectEmpty(group) {
  if (!group) return;
  const hasStory = group.querySelector(".news-story");
  let note = group.querySelector(".news-empty");
  if (!hasStory && !note) {
    note = document.createElement("p");
    note.className = "news-empty";
    note.textContent = "Nothing today.";
    group.appendChild(note);
  }
  const clearBtn = group.querySelector(".news-clear");
  if (clearBtn) clearBtn.style.display = hasStory ? "" : "none";
}

// On page load, hide any of today's stories already dismissed today, then tidy up any
// subject that ends up empty.
function applyDismissedNews() {
  const list = document.getElementById("news-list");
  if (!list) return;
  const ids = getDismissedNewsToday();
  for (const story of list.querySelectorAll(".news-story")) {
    if (ids.includes(story.dataset.newsid)) story.remove();
  }
  for (const group of list.querySelectorAll(".news-subject")) {
    updateNewsSubjectEmpty(group);
  }
}

// The relay's address for one widget, from that widget's hidden config box ("" if none).
// Strips a trailing "/" so either spelling in config.json works.
function relayFrom(configId) {
  const box = document.getElementById(configId);
  return box && box.dataset.relay ? box.dataset.relay.replace(/\/+$/, "") : "";
}

// ==================================================================
// Live stocks, through the relay (added 2026-11-09)
// ------------------------------------------------------------------
// Yahoo, like YouTube, does not let a browser read it directly, so prices come through
// the relay (?stock=SYMBOL). Each row Python drew is REPLACED by a fresh one when the
// relay answers for that symbol, and left as it was when it doesn't. Mirrors
// panels/stocks.py — keep the number formatting and the sparkline in step with it.
// ==================================================================

// "7,549.94": two decimals with thousands commas, like Python's "{:,.2f}".
function formatTwoDecimals(n) {
  return n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

// The price as shown: a "$" only for a company's shares. An index (symbol starts with
// "^", like ^GSPC) is measured in points, not dollars. Same rule as format_price().
function formatPrice(symbol, price) {
  const text = formatTwoDecimals(price);
  return symbol.charAt(0) === "^" ? text : "$" + text;
}

// A tiny line chart of the day's prices, as SVG text. A translation of sparkline_svg()
// in panels/stocks.py. Built only from numbers, so it can't carry anything unsafe.
function sparklineSvg(prices, goingUp) {
  if (!prices || prices.length < 2) return "";
  const width = 150, height = 40, pad = 4;
  const low = Math.min.apply(null, prices);
  const high = Math.max.apply(null, prices);
  const span = (high - low) || 1;          // a perfectly flat line would divide by zero
  const points = prices.map(function (p, i) {
    const x = i / (prices.length - 1) * width;
    const y = pad + (1 - (p - low) / span) * (height - 2 * pad);   // SVG's y grows downward
    return x.toFixed(1) + "," + y.toFixed(1);
  });
  const colour = goingUp ? "#1a9e5f" : "#d64545";
  return '<svg class="spark" viewBox="0 0 ' + width + ' ' + height + '" preserveAspectRatio="none">'
       + '<polyline points="' + points.join(" ") + '" fill="none" stroke="' + colour + '"'
       + ' stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>';
}

// Ask the relay for one symbol and return {price, previous, prices}. Throws on failure.
// Like panels/stocks.py: today's prices every 15 minutes, or — if today has none yet
// (weekend, holiday, early morning) — the last few days, one price a day.
async function fetchStockLive(relay, symbol) {
  const base = relay + "/?stock=" + encodeURIComponent(symbol);
  const reply = await fetch(base + "&range=1d");
  if (!reply.ok) throw new Error("relay answered " + reply.status);
  const result = (await reply.json()).chart.result[0];
  const meta = result.meta;
  // Yahoo leaves gaps (null) where no trade happened in a 15-minute slot; drop those.
  let prices = (result.indicators.quote[0].close || []).filter(function (p) { return p != null; });
  // "previousClose" is yesterday's closing price — what today's change is measured from.
  let previous = meta.previousClose != null ? meta.previousClose : meta.chartPreviousClose;
  if (prices.length < 2) {
    const daily = await fetch(base + "&range=5d");
    if (daily.ok) {
      const dailyResult = (await daily.json()).chart.result[0];
      prices = (dailyResult.indicators.quote[0].close || []).filter(function (p) { return p != null; });
    }
  }
  if (typeof meta.regularMarketPrice !== "number" || typeof previous !== "number") {
    throw new Error("no price in the reply");
  }
  return { price: meta.regularMarketPrice, previous: previous, prices: prices };
}

// One stock row, the same shape panels/stocks.py draws. The name goes in as textContent
// so nothing in config.json can inject HTML.
function buildStockRow(ticker, data) {
  const change = data.price - data.previous;
  const percent = change / data.previous * 100;
  const goingUp = change >= 0;
  const sign = goingUp ? "+" : "";

  const row = document.createElement("div");
  row.className = "stock";
  row.dataset.symbol = ticker.symbol;
  const name = document.createElement("div");
  name.className = "stock-sym";
  name.textContent = ticker.name;
  row.appendChild(name);
  row.insertAdjacentHTML("beforeend", sparklineSvg(data.prices, goingUp));
  const nums = document.createElement("div");
  nums.className = "stock-nums";
  const price = document.createElement("div");
  price.className = "stock-price";
  price.textContent = formatPrice(ticker.symbol, data.price);
  const moved = document.createElement("div");
  moved.className = "stock-change";
  moved.style.color = goingUp ? "green" : "red";
  moved.textContent = sign + formatTwoDecimals(change) + " (" + sign + percent.toFixed(2) + "%)";
  nums.appendChild(price);
  nums.appendChild(moved);
  row.appendChild(nums);
  return row;
}

async function refreshStocks() {
  const relay = relayFrom("stocks-live-config");
  const list = document.getElementById("stocks-list");
  const stamp = document.getElementById("stocks-stamp");
  if (!relay || !list) return;             // no relay, or the panel failed soft
  const tickers = JSON.parse(document.getElementById("stocks-live-config").dataset.tickers || "[]");
  if (stamp) stamp.textContent = "Checking prices…";

  const answers = await Promise.all(tickers.map(function (t) {
    return fetchStockLive(relay, t.symbol).catch(function () { return null; });
  }));

  // Rebuild in config.json's order: a live row where the relay answered, otherwise the
  // row the build drew for that symbol (if it drew one).
  const oldRows = {};
  list.querySelectorAll(".stock").forEach(function (row) { oldRows[row.dataset.symbol] = row; });
  list.innerHTML = "";
  let answered = 0;
  tickers.forEach(function (t, i) {
    if (answers[i]) { answered += 1; list.appendChild(buildStockRow(t, answers[i])); }
    else if (oldRows[t.symbol]) { list.appendChild(oldRows[t.symbol]); }
  });

  if (stamp) {
    const when = pacificClock(new Date());
    if (answered === tickers.length) stamp.textContent = "Live · checked " + when;
    else if (answered > 0) stamp.textContent = "Live · checked " + when + " · " + answered + " of " + tickers.length + " answered";
    else stamp.textContent = "Couldn't reach Yahoo at " + when + " · showing the last build's prices";
  }
}

// ==================================================================
// Live news, through the relay (added 2026-11-09)
// ------------------------------------------------------------------
// Google News comes through the relay (?news=QUERY). Each subject is fetched fresh,
// grouped into stories exactly the way panels/news.py does it, and drawn in the same
// shape — so the ✕ buttons and today's dismissals keep working unchanged. A subject the
// relay could not get keeps the group the build drew.
//
// The grouping below is a TRANSLATION of significant_words / same_story / cluster_stories
// in panels/news.py. If one changes, change the other, or the build and the live page
// will group the same headlines differently.
// ==================================================================

const NEWS_STOPWORDS = new Set([
  "the", "a", "an", "and", "or", "but", "for", "nor", "so", "yet", "of", "to", "in",
  "on", "at", "by", "with", "from", "as", "is", "are", "was", "were", "be", "been",
  "it", "its", "this", "that", "these", "those", "he", "she", "they", "you", "we",
  "his", "her", "their", "your", "our", "not", "will", "has", "have", "had", "new",
  "says", "say", "said", "after", "over", "into", "out", "up", "down", "who", "what",
  "how", "why", "when", "amid", "vs", "-"
]);

// A headline reduced to its meaningful words (a Set), minus the `ignore` words.
function significantWords(headline, ignore) {
  const words = (headline || "").toLowerCase().match(/[a-z0-9]+/g) || [];
  const keep = new Set();
  words.forEach(function (w) {
    if ((w.length >= 3 || /^\d+$/.test(w)) && !NEWS_STOPWORDS.has(w) && !(ignore && ignore.has(w))) {
      keep.add(w);
    }
  });
  return keep;
}

// Same crude test as same_story(): 2+ shared words, making up 40%+ of the shorter one.
function sameStory(a, b) {
  if (!a.size || !b.size) return false;
  let shared = 0;
  a.forEach(function (w) { if (b.has(w)) shared += 1; });
  if (shared < 2) return false;
  return shared / Math.min(a.size, b.size) >= 0.4;
}

// Greedy grouping, as cluster_stories(): each item joins the first story it matches.
function clusterStories(items, ignore) {
  const stories = [];
  items.forEach(function (item) {
    const words = significantWords(item.headline, ignore);
    const home = stories.find(function (s) { return sameStory(words, s.words); });
    if (home) {
      home.items.push(item);
      words.forEach(function (w) { home.words.add(w); });   // grow the story's word set
    } else {
      stories.push({ words: words, items: [item] });
    }
  });
  return stories;
}

// "2h ago" — same wording as relative_time() in Python.
function relativeTime(epoch) {
  const diff = Date.now() / 1000 - epoch;
  if (diff < 3600) return Math.max(1, Math.floor(diff / 60)) + "m ago";
  if (diff < 86400) return Math.floor(diff / 3600) + "h ago";
  return Math.floor(diff / 86400) + "d ago";
}

// Ask the relay for one subject's feed and turn it into items shaped like Python's
// entry_to_item(): {headline, url, source, published_epoch}. Throws on failure.
async function fetchNewsLive(relay, query) {
  const reply = await fetch(relay + "/?news=" + encodeURIComponent(query || ""));
  if (!reply.ok) throw new Error("relay answered " + reply.status);
  const xml = new DOMParser().parseFromString(await reply.text(), "text/xml");
  const items = [];
  for (const entry of xml.getElementsByTagName("item")) {
    const text = function (tag) {
      const el = entry.getElementsByTagName(tag)[0];
      return el ? el.textContent.trim() : "";
    };
    const published = Date.parse(text("pubDate"));
    if (isNaN(published)) continue;                  // no date: can't order it, skip
    // Google writes titles as "Headline - Outlet"; split on the LAST " - ".
    const raw = text("title");
    const cut = raw.lastIndexOf(" - ");
    const headline = cut >= 0 ? raw.slice(0, cut).trim() : raw;
    const outletFromTitle = cut >= 0 ? raw.slice(cut + 3).trim() : "";
    items.push({
      headline: headline,
      url: text("link"),
      source: text("source") || outletFromTitle || "Unknown",
      published_epoch: Math.floor(published / 1000)
    });
  }
  return items;
}

// Draw one subject's group from its items — the same HTML shape build_news_panel() writes.
// Already-dismissed stories are left out BEFORE taking the top few, so a ✕ doesn't leave a
// subject showing fewer stories than it could.
function buildNewsSubject(subject, items, perSubject, dismissedIds) {
  const today = pacificYmd(new Date());
  const todays = items.filter(function (i) { return pacificYmd(new Date(i.published_epoch * 1000)) === today; });
  // Ignore the subject's own words when matching (see the Half-Life 3 note in news.py).
  const ignore = significantWords((subject.name || "") + " " + (subject.query || ""));
  const ranked = clusterStories(todays, ignore).map(function (story) {
    const sources = Array.from(new Set(story.items.map(function (i) { return i.source; }))).sort();
    const newest = story.items.reduce(function (a, b) { return b.published_epoch > a.published_epoch ? b : a; });
    return { headline: newest.headline, url: newest.url, sources: sources, count: sources.length, epoch: newest.published_epoch };
  }).filter(function (s) { return !dismissedIds.includes(s.url); })
    .sort(function (a, b) { return (b.count - a.count) || (b.epoch - a.epoch); })
    .slice(0, perSubject);

  const group = document.createElement("div");
  group.className = "news-subject";
  group.dataset.subject = subject.name;
  const heading = document.createElement("div");
  heading.className = "news-subject-title";
  heading.textContent = subject.name;
  if (ranked.length) {
    const clear = document.createElement("button");
    clear.className = "news-clear"; clear.title = "Clear these headlines";
    clear.innerHTML = "&#10005;";
    clear.onclick = function () { clearNewsSubject(this); };
    heading.appendChild(clear);
  }
  group.appendChild(heading);

  ranked.forEach(function (story) {
    const row = document.createElement("div");
    row.className = "news-story";
    row.dataset.newsid = story.url;
    const link = document.createElement("a");
    link.className = "news-headline";
    link.href = story.url; link.target = "_blank"; link.rel = "noopener";
    link.textContent = story.headline;
    const sub = document.createElement("div");
    sub.className = "news-sub";
    const badge = document.createElement("span");
    badge.className = "news-badge " + (story.count >= 2 ? "multi" : "single");
    badge.textContent = story.count >= 2 ? "✓ " + story.count + " sources" : "1 source";
    const src = document.createElement("span");
    src.className = "news-src";
    const shown = story.sources.slice(0, 3);
    src.textContent = shown.join(", ") + (story.count > shown.length ? " +" + (story.count - shown.length) : "");
    const when = document.createElement("span");
    when.className = "news-time";
    when.textContent = relativeTime(story.epoch);
    const remove = document.createElement("button");
    remove.className = "news-remove"; remove.title = "Remove";
    remove.innerHTML = "&#10005;";
    remove.onclick = function () { dismissNews(this); };
    sub.appendChild(badge); sub.appendChild(src); sub.appendChild(when); sub.appendChild(remove);
    row.appendChild(link); row.appendChild(sub);
    group.appendChild(row);
  });
  updateNewsSubjectEmpty(group);     // "Nothing today." if it ended up empty
  return group;
}

async function refreshNews() {
  const relay = relayFrom("news-live-config");
  const list = document.getElementById("news-list");
  const stamp = document.getElementById("news-stamp");
  if (!relay || !list) return;
  const box = document.getElementById("news-live-config");
  const subjects = JSON.parse(box.dataset.subjects || "[]");
  const perSubject = Number(box.dataset.perSubject) || 4;
  if (stamp) stamp.textContent = "Checking the news…";

  const answers = await Promise.all(subjects.map(function (s) {
    return fetchNewsLive(relay, s.query).catch(function () { return null; });
  }));

  // Rebuild in config.json's order: a live group where the relay answered, otherwise the
  // group the build drew for that subject.
  const oldGroups = {};
  list.querySelectorAll(".news-subject").forEach(function (g) { oldGroups[g.dataset.subject] = g; });
  const dismissedIds = getDismissedNewsToday();
  const scrolledTo = list.scrollTop;
  list.innerHTML = "";
  let answered = 0;
  subjects.forEach(function (s, i) {
    if (answers[i]) { answered += 1; list.appendChild(buildNewsSubject(s, answers[i], perSubject, dismissedIds)); }
    else if (oldGroups[s.name]) { list.appendChild(oldGroups[s.name]); }
  });
  list.scrollTop = scrolledTo;
  applyDismissedNews();              // tidy the kept build groups the same way as on load

  if (stamp) {
    const when = pacificClock(new Date());
    const caveat = " · ✓ = how many outlets ran it (a rough signal, not proof)";
    if (answered === subjects.length) stamp.textContent = "Today · live · checked " + when + caveat;
    else if (answered > 0) stamp.textContent = "Today · live · checked " + when + " · " + answered + " of " + subjects.length + " subjects answered" + caveat;
    else stamp.textContent = "Couldn't reach Google News at " + when + " · showing the last build's headlines";
  }
}

// ==================================================================
// Candle lighting and Havdalah, from Hebcal (added 2026-11-09)
// ------------------------------------------------------------------
// Eli asked for MyZmanim's times; MyZmanim's data service needs a paid account and a key
// that anyone could read out of this public page, so — with his agreement — this uses
// Hebcal, which is free, needs no key, and lets a browser read it directly (no relay).
// Standard rule: candle lighting 18 minutes before sunset; Havdalah at nightfall (Hebcal's
// "M=on": the sun 8.5° below the horizon).
//
// WHEN IT SHOWS: from the start of the day before the first candle lighting, until
// Havdalah has passed — candle lighting AND Havdalah together, because Eli can't use his
// phone on Shabbat, so he needs Havdalah's time before it starts. Multi-day holidays
// (Pesach, Rosh Hashana, a Yom Tov running into Shabbat) list every candle lighting in the
// run, then the one Havdalah at its end. The rest of the time the strip is hidden.
// ==================================================================

const SHABBAT_SHOW_DAYS_BEFORE = 1;

async function refreshShabbat() {
  const strip = document.getElementById("shabbat-strip");
  if (!strip) return;
  const day = 24 * 3600 * 1000;
  const now = new Date();
  // Ask for a window from two days ago (so a Shabbat already under way still finds its own
  // candle lighting) to ten days ahead (so the next one is always in it).
  const address = "https://www.hebcal.com/hebcal?v=1&cfg=json&c=on&M=on&maj=on&min=off&mod=off"
    + "&nx=off&mf=off&ss=off&s=off&latitude=" + LATITUDE + "&longitude=" + LONGITUDE
    + "&tzid=America/Los_Angeles&start=" + pacificYmd(new Date(now - 2 * day))
    + "&end=" + pacificYmd(new Date(now.getTime() + 10 * day));

  let items;
  try {
    const reply = await fetch(address);
    if (!reply.ok) throw new Error("Hebcal answered " + reply.status);
    items = (await reply.json()).items || [];
  } catch (e) {
    // Rare, but say so rather than quietly showing nothing on an Erev Shabbat.
    strip.textContent = "Couldn't load candle-lighting times from Hebcal right now.";
    strip.hidden = false;
    return;
  }

  // Just the candle lightings and Havdalahs, in time order.
  const times = items
    .filter(function (i) { return i.category === "candles" || i.category === "havdalah"; })
    .map(function (i) { return { kind: i.category, at: new Date(i.date), memo: i.memo || "" }; })
    .sort(function (a, b) { return a.at - b.at; });

  // The next Havdalah still to come, and the run of candle lightings just before it.
  const end = times.findIndex(function (t) { return t.kind === "havdalah" && t.at > now; });
  if (end < 0) { strip.hidden = true; return; }
  let start = end;
  while (start > 0 && times[start - 1].kind === "candles") start -= 1;
  const run = times.slice(start, end + 1);

  // Only from the day before the first candle lighting. Comparing Pacific YYYY-MM-DD text
  // works because that format sorts in date order.
  const firstAt = run[0].at;
  const showFrom = pacificYmd(new Date(firstAt.getTime() - SHABBAT_SHOW_DAYS_BEFORE * day));
  if (pacificYmd(now) < showFrom) { strip.hidden = true; return; }

  // A title from Hebcal's own names: "" means plain Shabbat; "Erev Pesach", "Pesach I",
  // "Pesach VII" all become "Pesach".
  const names = [];
  run.forEach(function (t) {
    if (t.kind !== "candles") return;
    const name = t.memo === "" ? "Shabbat"
      : t.memo.replace(/^Erev\s+/, "").replace(/\s*\(.*\)\s*$/, "").replace(/\s+[IVX]+$/, "");
    if (!names.includes(name)) names.push(name);
  });

  strip.innerHTML = "";
  const title = document.createElement("div");
  title.className = "shabbat-title";
  title.textContent = "🕯️ " + (names.join(" · ") || "Shabbat");
  strip.appendChild(title);
  run.forEach(function (t) {
