# Rebuilds the dashboard in the cloud and publishes it to GitHub Pages.
#
# Why this file exists: main.py has to re-run for stocks/YouTube/news to refresh.
# On the laptop that job belonged to a Windows Scheduled Task, which cannot run
# while the laptop is asleep (proven 2026-07-25: a 28-hour sleep left Eli looking
# at a day-old page). GitHub runs this on their machines instead, so the laptop
# being closed no longer matters.

name: Build dashboard

on:
  # Rebuild on a timer. The five fields are: minute hour day month weekday.
  # This says "at 3, 13, 23, 33, 43 and 53 minutes past every hour" — six chances an hour.
  #
  # WHY SIX SLOTS INSTEAD OF THE OBVIOUS "*/30" (measured 2026-07-27): GitHub runs
  # scheduled workflows on free public repos at the LOWEST priority and simply DROPS them
  # when its machines are busy. It never reports an error — the run just never happens.
  # With "*/30" the dashboard was rebuilding roughly every TWO HOURS instead of every 30
  # minutes: 12 runs in 24.5 hours instead of the expected 48, with gaps up to 241 min.
  # Two things fix that here:
  #   1. Odd minutes. "*/30" fires at :00 and :30, the two busiest minutes on the whole
  #      platform, so those are the runs most likely to be dropped. 3/13/23/… avoids the
  #      stampede.
  #   2. More attempts. Each slot is an independent chance to fire, so even when most are
  #      dropped the page still refreshes far more often.
  # This costs nothing: Actions minutes are UNLIMITED on a public repo and a build is ~2
  # minutes. It does not hammer YouTube either — panels only re-fetch when their 15-minute
  # cache is stale (see CACHE_MAX_AGE in panels/common.py), so extra builds mostly just
  # re-publish the same data. Six an hour also stays under GitHub Pages' soft limit of ten
  # builds per hour, which is why this does not go every 5 minutes.
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  # Also put a "Run workflow" button in the repo's Actions tab, so Eli can force
  # a rebuild by hand without waiting for the next scheduled run.
  workflow_dispatch:
    # Options shown next to that button. A plain manual run reuses anything fetched in
    # the last 15 minutes, so pressing the button right after a build would republish the
    # SAME videos and headlines. Ticking this box makes the run ignore the cache and
    # actually go and fetch. Leave it unticked unless the data really looks stuck —
    # re-fetching 25 YouTube feeds and 10 news feeds back-to-back is what gets us throttled.
    inputs:
      force_refresh:
        description: "Ignore the 15-minute cache and re-fetch everything"
        type: boolean
        default: false
  # And rebuild whenever code is pushed to main, so a change to a panel or to
  # config.json shows up on the live page straight away instead of waiting for
  # the next scheduled run.
  push:
    branches: [main]

# Permissions this workflow needs. GitHub gives a workflow nothing by default,
# so publishing to Pages has to be asked for explicitly.
permissions:
  contents: read    # read the project files
  pages: write      # publish to GitHub Pages
  id-token: write   # required by the deploy-pages action to prove who it is

# If a run is still going when the next one starts, queue the new one instead of
# running both at once. Two builds publishing to Pages together can clash.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest   # a fresh Linux machine, rented free for this run

    # Tells GitHub this job is the thing that deploys to Pages, and records the
    # published URL on the run's summary page.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # A healthy build is ~2 minutes. If a run is still going after 20 the feeds
    # are badly throttled and it is stuck — kill it rather than let it hang.
    timeout-minutes: 20

    steps:
      # 1. Copy the project files onto the runner.
      - name: Get the project files
        uses: actions/checkout@v4

      # 2. Install Python. "cache: pip" saves the downloaded packages between
      #    runs so the install step is fast after the first time.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the libraries from requirements.txt
        run: pip install -r requirements.txt

      # 3. Bring back the previous run's cache/ folder.
      #    IMPORTANT: panels/youtube.py and panels/news.py protect against
      #    throttling by reading the PREVIOUS cache/*.json and carrying a
      #    channel's or subject's last-known items forward when a feed returns
      #    nothing. Every run gets a brand-new empty machine, so without this
      #    step that safety net silently would not work at all, and a single
      #    throttled run could blank a whole widget.
      #    "restore-keys" means: if there is no exact match, take the most
      #    recent cache whose name starts with "dashboard-cache-".
      - name: Restore the previous run's cached feed data
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: dashboard-cache-${{ github.run_id }}
          restore-keys: |
            dashboard-cache-

      # 4. The actual build — same command Eli runs locally. Writes dashboard.html.
      #    "env:" hands the script an environment variable — a named value the program can
      #    read as it starts. FORCE_REFRESH is "true" only when this run came from the
      #    Run-workflow button WITH the force_refresh box ticked; on a scheduled or push
      #    run, inputs.force_refresh is empty and this is just "". panels/common.py checks
      #    it in force_refresh_requested() and skips the 15-minute cache when it is set.
      - name: Build the dashboard
        run: python main.py
        env:
          FORCE_REFRESH: ${{ inputs.force_refresh }}

      # 5. Save cache/ for the next run. "if: always()" so the data is still kept
      #    even if a later step fails.
      - name: Save the cached feed data for next time
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: dashboard-cache-${{ github.run_id }}

      # 6. GitHub Pages serves a folder, and looks for "index.html" as the page
      #    people land on. So put the freshly built dashboard in an empty folder
      #    under that name.
      - name: Put the built page into a folder for Pages
        run: |
          mkdir -p _site
          cp dashboard.html _site/index.html

      # 7. Hand that folder to Pages and publish it.
      - name: Package the folder for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
