    const row = document.createElement("div");
    row.className = "shabbat-row";
    const dayEl = document.createElement("span");
    dayEl.className = "shabbat-day";
    dayEl.textContent = pacificDayLabel(t.at);
    const what = document.createElement("span");
    what.textContent = t.kind === "candles" ? "Candle lighting" : "Havdalah";
    const time = document.createElement("span");
    time.className = "shabbat-time";
    time.textContent = pacificClock(t.at);
    row.appendChild(dayEl); row.appendChild(what); row.appendChild(time);
    strip.appendChild(row);
  });
  const note = document.createElement("div");
  note.className = "shabbat-note";
  note.textContent = "From Hebcal · 18 min before sunset · Havdalah at nightfall";
  strip.appendChild(note);
  strip.hidden = false;
}

// Wire everything up once the page has loaded.
window.addEventListener("DOMContentLoaded", function () {
  applyDismissed();
  applyDismissedNews();
  document.getElementById("refresh-btn").innerHTML = refreshLabel();
  // Everything below fetches over the network. None of it is awaited: the build's own
  // content shows at once, and each widget updates itself when its answer lands.
  refreshScores();       // ESPN (direct)
  refreshShabbat();      // Hebcal (direct)
  refreshYouTube();      // through the relay
  refreshNews();         // through the relay
  refreshStocks();       // through the relay
});

// ==================================================================
// Freshness countdown (the strip under the page title)
// ------------------------------------------------------------------
// Python wrote, into #fresh-data, the moment each source was last really fetched and the
// moment its saved copy goes stale (15 minutes later — see CACHE_MAX_AGE in
// panels/common.py). This turns those fixed numbers into a live countdown, which a static
// page could not do on its own: the text Python writes starts ageing the second it is
// written, and this tab may sit open for hours.
//
// What it is for: knowing whether pressing "Run a rebuild" is worth it. While every cache
// is still fresh a rebuild republishes the SAME videos and headlines, so the countdown
// tells you how long until a plain rebuild would fetch for real.

// The times Python left for us. JSON.parse turns that text back into a JavaScript array.
// Wrapped in a check because the strip is allowed to be missing (it fails soft to "").
const freshDataEl = document.getElementById("fresh-data");
const freshNextEl = document.getElementById("fresh-next");
const freshSources = freshDataEl ? JSON.parse(freshDataEl.dataset.sources) : [];

function formatGap(milliseconds) {
  // Turn a length of time into "7m 12s" (or just "12s" under a minute).
  const totalSeconds = Math.max(0, Math.round(milliseconds / 1000));
  const minutes = Math.floor(totalSeconds / 60);
  const seconds = totalSeconds % 60;
  return minutes > 0 ? minutes + "m " + seconds + "s" : seconds + "s";
}

function updateFreshness() {
  if (!freshNextEl) return;              // no strip on the page — nothing to update
  const now = Date.now();

  // The soonest moment any source's saved copy goes stale. A source with no cache file
  // at all (expires === null) counts as due right now, so it reports as ready.
  let soonestExpiry = null;
  for (const source of freshSources) {
    if (source.expires === null) { soonestExpiry = now; break; }
    if (soonestExpiry === null || source.expires < soonestExpiry) {
      soonestExpiry = source.expires;
    }
  }

  if (soonestExpiry === null) {
    freshNextEl.textContent = "";        // nothing cached to report on
    return;
  }

  if (now >= soonestExpiry) {
    // The cache has aged out, so the next build — scheduled or manual — fetches for real.
    freshNextEl.textContent = "Ready · a rebuild will fetch new data";
    freshNextEl.classList.add("is-ready");
  } else {
    // Still inside the 15-minute window. Say how long is left, and point out the escape
    // hatch: the force_refresh box on the Run-workflow button ignores the cache entirely.
    freshNextEl.textContent = "New data in " + formatGap(soonestExpiry - now)
                            + " · sooner only with force_refresh";
    freshNextEl.classList.remove("is-ready");
  }
}

// Tick once a second. Cheap, and it keeps the countdown honest while the tab is open.
updateFreshness();
setInterval(updateFreshness, 1000);

// ==================================================================
// Auto-reload: pick up the newest build on its own
// ------------------------------------------------------------------
// GitHub Actions re-runs main.py in the cloud and republishes this page (six scheduled
// slots an hour, though GitHub drops many of them — see .github/workflows/build.yml).
// But an already-open browser tab keeps
// showing the OLD version until it reloads. We get the tab to reload itself two ways:
//
//   1. A timer, every 30 minutes, matching the rebuild schedule.
//   2. Whenever the tab comes back into view (you switch to it, unlock the phone, or
//      wake the laptop). This is the important one: browsers FREEZE the timer above
//      while a tab is in the background or the machine is asleep, so after a few hours
//      away the timer may never have fired and the page is stale (the "as of 8pm at
//      11pm" problem). Reloading the moment you look at it fixes that.
//
// To avoid reloading pointlessly (e.g. every quick tab-switch), the view-based reload
// only fires if it has been at least RELOAD_MINUTES since this page last loaded.
// Reloading re-reads the file from disk; deletions are safe
// because those live in localStorage, which survives reloads.
const RELOAD_MINUTES = 30;
const pageLoadedAt = Date.now();  // when this particular page view started

// 1. The plain timer (works while the tab is active and awake).
setTimeout(function () {
  location.reload();
}, RELOAD_MINUTES * 60 * 1000);

// 2. Reload on return-to-view, but only if the page is already stale.
document.addEventListener("visibilitychange", function () {
  // visibilityState becomes "visible" when the tab is brought to the front / the
  // screen wakes. document.hidden is false at that moment.
  if (document.hidden) return;                       // ignore going AWAY from the tab
  const minutesOpen = (Date.now() - pageLoadedAt) / 60000;
  if (minutesOpen >= RELOAD_MINUTES) {
    location.reload();                               // it's old — grab the fresh build
  }
});
</script>
